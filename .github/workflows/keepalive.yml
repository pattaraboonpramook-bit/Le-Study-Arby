name: Supabase keep-alive

# Pings the Supabase backend once a day so the free project never goes idle
# long enough to auto-pause. The anon/publishable key below is public by design
# (protected by Row-Level Security), so it's fine to keep here.

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          KEY="sb_publishable_H2V0fITxvBeSl6jgu_3KlQ_amYKOgKw"
          URL="https://sagdkgpoxkdwhxrzyxsh.supabase.co/rest/v1/notes?select=id&limit=1"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase responded with HTTP $code"
