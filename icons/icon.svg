<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Recall">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a54e0"/>
      <stop offset="1" stop-color="#4a37ad"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7dffb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- four-point sparkle: a concave star -->
  <path fill="url(#spark)" d="M256 96
    C 268 176, 336 244, 416 256
    C 336 268, 268 336, 256 416
    C 244 336, 176 268, 96 256
    C 176 244, 244 176, 256 96 Z"/>
  <!-- small accent spark -->
  <path fill="#ffffff" opacity="0.85" d="M150 120
    C 155 148, 172 165, 200 170
    C 172 175, 155 192, 150 220
    C 145 192, 128 175, 100 170
    C 128 165, 145 148, 150 120 Z"/>
</svg>
